name: Duck.ai Website Automation

on:
  push:
    branches:
      - duckai
    paths:
      - "duckai_automation/website_request.txt"
      - "duckai_automation/design_brief.txt"
      - "duckai_automation/source_url.txt"
  workflow_dispatch:
    inputs:
      website_request:
        description: "The website to generate"
        required: true
        type: string
      design_brief:
        description: "Concise design guidance; when source_url is set, let Duck.ai assess the business facts in-chat"
        required: true
        type: string
      source_url:
        description: "Optional live website URL for a Duck.ai source assessment in the same chat before redesign"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: duckai-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root --shm-size=1gb
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Require the duckai branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$TARGET_BRANCH" != "duckai" ]]; then
            echo "Run this workflow on the duckai branch; selected branch was '$TARGET_BRANCH'."
            exit 1
          fi

      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-playwright.txt

      - name: Generate candidates until three pass automated checks
        id: generate
        env:
          WEBSITE_REQUEST: ${{ inputs.website_request }}
          DESIGN_BRIEF: ${{ inputs.design_brief }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          successful=0
          attempt=0
          target=3
          max_attempts=6
          while [[ "$successful" -lt "$target" && "$attempt" -lt "$max_attempts" ]]; do
            attempt=$((attempt + 1))
            echo "Starting website candidate attempt ${attempt}; automated successes so far: ${successful}/${target}."
            CANDIDATE_INDEX="$attempt" xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python duckai_automation/run_duckai.py
            run_dir="duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-candidate-${attempt}"
            if python -c 'import json,sys; print(str(json.load(open(sys.argv[1], encoding="utf-8")).get("automated_success", False)).lower())' "$run_dir/run_notes.json" | grep -qx true; then
              successful=$((successful + 1))
              echo "Candidate attempt ${attempt} passed all automated checks (${successful}/${target})."
            else
              echo "Candidate attempt ${attempt} did not pass all automated checks. Its report will be retained."
            fi
          done
          echo "attempt_count=${attempt}" >> "$GITHUB_OUTPUT"
          echo "successful_count=${successful}" >> "$GITHUB_OUTPUT"
          echo "Automated successes: ${successful}/${target} after ${attempt} candidate attempts."

      - name: Commit generated website run to selected branch
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          ATTEMPT_COUNT: ${{ steps.generate.outputs.attempt_count }}
          SUCCESSFUL_COUNT: ${{ steps.generate.outputs.successful_count }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          run_dirs=(duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-candidate-*)
          for run_dir in "${run_dirs[@]}"; do
            [[ -d "$run_dir" ]] && git add -- "$run_dir"
          done
          if git diff --cached --quiet; then
            echo "No candidate evidence was produced for this workflow run."
            exit 0
          fi
          git commit -m "duckai: save candidate evidence from workflow run ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Pushed candidate evidence for workflow run ${GITHUB_RUN_ID} to ${TARGET_BRANCH}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on the selected branch."
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            sleep 2
          done
          echo "Could not push the generated run after three attempts."
          exit 1

      - name: Require three automated successes
        env:
          SUCCESSFUL_COUNT: ${{ steps.generate.outputs.successful_count }}
        run: |
          set -euo pipefail
          if [[ "$SUCCESSFUL_COUNT" -lt 3 ]]; then
            echo "Only ${SUCCESSFUL_COUNT} of 3 required automated successes were produced. Review the committed candidate reports."
            exit 1
          fi
          echo "Three candidates passed the automated checker and Playwright browser QA. Human visual and image-relevance review remains pending."
