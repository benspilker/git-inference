name: Duck.ai Website Automation

on:
  push:
    branches:
      - duckai
    paths:
      - "duckai_automation/source_urls.csv"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Full batch or one-candidate CSV smoke test"
        required: true
        default: full_batch
        type: choice
        options:
          - full_batch
          - smoke_test
      smoke_website:
        description: "Optional website value from source_urls.csv for smoke_test; blank selects the first row"
        required: false
        type: string
      source_url:
        description: "Optional single-site override for full_batch mode; blank processes the CSV"
        required: false
        type: string
      business_name:
        description: "Required with source_url; identifies the target business"
        required: false
        type: string
      industry_category:
        description: "Required with source_url; provides industry design context"
        required: false
        type: string
      location:
        description: "Optional with source_url; unverified location context"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: duckai-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Require the duckai branch
        if: github.ref_name != 'duckai'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          echo "Run this workflow on the duckai branch; selected branch was '${TARGET_BRANCH}'."
          exit 1

      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Validate target CSV and create job matrix
        id: targets
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          SMOKE_WEBSITE: ${{ inputs.smoke_website }}
          SOURCE_URL: ${{ inputs.source_url }}
          BUSINESS_NAME: ${{ inputs.business_name }}
          INDUSTRY_CATEGORY: ${{ inputs.industry_category }}
          LOCATION: ${{ inputs.location }}
        run: python duckai_automation/scripts/build_target_matrix.py

  generate:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root --shm-size=1gb
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-playwright.txt

      - name: Generate website candidates and run automated checks
        id: generate
        env:
          SOURCE_URL: ${{ matrix.target.source_url }}
          BUSINESS_NAME: ${{ matrix.target.business }}
          INDUSTRY_CATEGORY: ${{ matrix.target.category }}
          LOCATION: ${{ matrix.target.location }}
          SITE_INDEX: ${{ matrix.target.site_index }}
          RUN_MODE: ${{ inputs.run_mode }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          successful=0
          attempt=0
          target=3
          max_attempts=6
          if [[ "${RUN_MODE:-full_batch}" == "smoke_test" ]]; then
            target=1
            max_attempts=1
            echo "Smoke mode: one CSV website and one full candidate attempt."
          fi
          while [[ "$successful" -lt "$target" && "$attempt" -lt "$max_attempts" ]]; do
            attempt=$((attempt + 1))
            echo "Starting candidate ${attempt} for site ${SITE_INDEX}; successes: ${successful}/${target}."
            run_dir="duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-${SITE_INDEX}-candidate-${attempt}"
            action_log="${RUNNER_TEMP}/duckai-site-${SITE_INDEX}-candidate-${attempt}.log"
            set +e
            CANDIDATE_INDEX="$attempt" xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python -u duckai_automation/run_duckai.py 2>&1 | tee "$action_log"
            candidate_exit=${PIPESTATUS[0]}
            set -e
            if [[ -d "$run_dir" ]]; then
              mkdir -p "$run_dir/debug"
              cp "$action_log" "$run_dir/debug/action.log"
            fi
            if [[ "$candidate_exit" -ne 0 ]]; then
              echo "Candidate ${attempt} exited with code ${candidate_exit}; preserving evidence and continuing."
              if [[ ! -f "$run_dir/run_notes.json" && -d "$run_dir" ]]; then
                printf '{"site_index":%s,"candidate_index":%s,"automated_success":false,"status":"generation_failed"}\n' "$SITE_INDEX" "$attempt" > "$run_dir/run_notes.json"
              fi
              continue
            fi
            if python -c 'import json,sys; print(str(json.load(open(sys.argv[1], encoding="utf-8")).get("automated_success", False)).lower())' "$run_dir/run_notes.json" | grep -qx true; then
              successful=$((successful + 1))
              echo "Candidate ${attempt} passed all automated checks (${successful}/${target})."
            else
              echo "Candidate ${attempt} did not pass all automated checks. Its report will be retained."
            fi
          done
          echo "attempt_count=${attempt}" >> "$GITHUB_OUTPUT"
          echo "successful_count=${successful}" >> "$GITHUB_OUTPUT"
          echo "required_success_count=${target}" >> "$GITHUB_OUTPUT"
          echo "Automated successes for site ${SITE_INDEX}: ${successful}/${target} after ${attempt} attempts."

      - name: Commit generated candidates to selected branch
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          SITE_INDEX: ${{ matrix.target.site_index }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          run_dirs=(duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-${SITE_INDEX}-candidate-*)
          for run_dir in "${run_dirs[@]}"; do
            [[ -d "$run_dir" ]] && git add -- "$run_dir"
          done
          if git diff --cached --quiet; then
            echo "No candidate evidence was produced for this website."
            exit 0
          fi
          git commit -m "duckai: save candidates for site ${SITE_INDEX} from run ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Pushed site ${SITE_INDEX} candidate evidence to ${TARGET_BRANCH}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on the selected branch."
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            sleep 2
          done
          echo "Could not push the generated run after three attempts."
          exit 1

      - name: Require three automated successes for this website
        env:
          SUCCESSFUL_COUNT: ${{ steps.generate.outputs.successful_count }}
          REQUIRED_SUCCESS_COUNT: ${{ steps.generate.outputs.required_success_count }}
          SITE_INDEX: ${{ matrix.target.site_index }}
          BUSINESS_NAME: ${{ matrix.target.business }}
        run: |
          set -euo pipefail
          if [[ "$SUCCESSFUL_COUNT" -lt "$REQUIRED_SUCCESS_COUNT" ]]; then
            echo "Site ${SITE_INDEX} (${BUSINESS_NAME}) produced only ${SUCCESSFUL_COUNT} of ${REQUIRED_SUCCESS_COUNT} required successes. Review the committed candidate reports."
            exit 1
          fi
          echo "${SUCCESSFUL_COUNT} candidate(s) passed the automated checker and Playwright browser QA. Human visual and image-relevance review remains pending."
